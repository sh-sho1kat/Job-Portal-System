server:
  port: 5005

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/application_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          user-service:
            connect-timeout: 2000
            read-timeout: 3000

          company-service:
            connect-timeout: 2000
            read-timeout: 3000

          job-service:
            connect-timeout: 2000
            read-timeout: 3000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: job-portal-application-service
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    refresh-token-cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}

  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
