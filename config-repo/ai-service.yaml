server:
  port: 5007

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

gemini:
  api:
    key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash
  max-output-tokens: 2048
  temperature: 0.7
