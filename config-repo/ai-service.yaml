server:
  port: 5007

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# At least ONE provider key is required. Both keys default to "" so the
# service still boots with both unset (AI calls answer 503 with a clear
# message) — Gemini is preferred when configured, Groq is the fallback.
gemini:
  api:
    key: ${GEMINI_API_KEY:}
  model: gemini-3.5-flash-lite
  max-output-tokens: 2048
  temperature: 0.7

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  max-completion-tokens: 2048
  temperature: 0.6
  reasoning-effort: low
