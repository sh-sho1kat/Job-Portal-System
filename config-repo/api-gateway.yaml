server:
  port: 5000

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: job-portal-user-service
  cors:
    allowed-origins: ${APP_CORS_ALLOWEDORIGINS:http://localhost:5173,http://localhost:3000}
