<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hirely — find a job that aligns with your interests and skills, and hire great people."
    />
    <title>Hirely — Find work that works for you</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong mode. Keep in sync with THEME_STORAGE_KEY in src/lib/constants.ts.
      ;(() => {
        try {
          // ?theme=light|dark overrides for testing/screenshots; otherwise the
          // persisted choice wins, then the OS preference.
          const forced = new URLSearchParams(window.location.search).get('theme')
          const stored = localStorage.getItem('job-portal-theme')
          const dark = forced
            ? forced === 'dark'
            : stored
              ? stored === 'dark'
              : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch {
          // localStorage unavailable (private mode) — fall back to the light theme
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
