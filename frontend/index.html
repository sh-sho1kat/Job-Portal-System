<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Job Portal — search jobs, track applications, and hire. Candidate, employer, and admin surfaces."
    />
    <title>Job Portal</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong mode. Keep in sync with THEME_STORAGE_KEY in src/lib/constants.ts.
      ;(() => {
        try {
          const stored = localStorage.getItem('job-portal-theme')
          const dark =
            stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch {
          // localStorage unavailable (private mode) — fall back to the light theme
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
