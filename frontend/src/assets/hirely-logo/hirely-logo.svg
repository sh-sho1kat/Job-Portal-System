<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 112" role="img" aria-labelledby="title desc">
  <title id="title">Hirely</title>
  <desc id="desc">Hirely logo: a geometric H monogram with an upward career-path arrow and a clean wordmark.</desc>
  <g transform="translate(8 8)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- H monogram -->
    <path d="M24 18V78" stroke="#3F536F" stroke-width="10"/>
    <path d="M72 18V78" stroke="#3F536F" stroke-width="10"/>
    <!-- Rising career path that becomes the H crossbar -->
    <path d="M24 54H43L62 35" stroke="#6F98C8" stroke-width="9"/>
    <path d="M48 35H62V49" stroke="#6F98C8" stroke-width="8"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="116" y="73" font-size="58" font-weight="760" letter-spacing="-2.8" fill="#3F536F">Hire<tspan fill="#6F98C8">ly</tspan></text>
    <text x="120" y="96" font-size="11" font-weight="650" letter-spacing="3.4" fill="#8292A7">FIND YOUR NEXT MOVE</text>
  </g>
</svg>
