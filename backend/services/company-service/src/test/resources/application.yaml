# Test-only configuration: H2 in memory, no env vars or external database required.
spring:
  cloud:
    config:
      enabled: false   # shadowed-by-test main yaml loses spring.config.import; config server is not needed in tests
  application:
    name: company-service-test

  datasource:
    url: jdbc:h2:mem:company_service_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false     # no discovery server is running during tests
