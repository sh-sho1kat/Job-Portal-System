# Test-only configuration: H2 in memory, no env vars or external database required.
spring:
  application:
    name: job-service-test

  datasource:
    url: jdbc:h2:mem:job_service_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
