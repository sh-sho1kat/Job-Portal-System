server:
  port: 5001
spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   # default is for dev; set validate/none for production
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

app:
  jwt:
    secret: ${JWT_SECRET}            # Base64, at least 32 bytes: openssl rand -base64 32
    issuer: job-portal-user-service
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    refresh-token-cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}

  rate-limit:
    auth-max-requests: ${AUTH_RATE_LIMIT_MAX:30}       # max requests per client
    auth-window-seconds: ${AUTH_RATE_LIMIT_WINDOW:60}  # per this many seconds
