# Test-only configuration: H2 in memory, no env vars or external database required.
spring:
  cloud:
    config:
      enabled: false   # shadowed-by-test main yaml loses spring.config.import; config server is not needed in tests
  application:
    name: user-service-test

  datasource:
    url: jdbc:h2:mem:user_service_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: ZawcpoKYwCB8nlZp2YXPH5iP42mOLoH0JCuqI8wqREs=   # test-only, decodes to 32 bytes
    issuer: test-job-portal-user-service
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    refresh-token-cleanup-cron: "0 0 3 1 1 *"   # Jan 1st only: effectively never fires in tests

  rate-limit:
    auth-max-requests: 1000
    auth-window-seconds: 60
eureka:
  client:
    enabled: false     # no discovery server is running during tests
