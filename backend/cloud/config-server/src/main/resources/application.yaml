server:
  port: 8888

spring:
  application:
    name: config-server


  cloud:
    config:
      server:
        git:
          uri: "https://github.com/sh-sho1kat/Job-Portal-System"
          default-label: main
          search-paths: config-repo
          clone-on-start: false

Eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
